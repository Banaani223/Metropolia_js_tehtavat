<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript testing</title>
</head>
<body>
    <div id="output"></div>

    <script>

        let numbers = [];

        for (let i = 0; i < 5; i++) {
            numbers.push(prompt("Enter number " + (i + 1)));
        }

        for (let i = numbers.length - 1; i >= 0; i--) {
            document.getElementById("output").innerHTML += numbers[i] ;
        }
    </script>
</body>
</html>
